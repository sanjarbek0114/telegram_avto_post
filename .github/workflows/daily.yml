name: Kunlik post (19:00 Toshkent)

on:
  schedule:
    # 13:20 UTC = 18:20 Toshkent. GitHub cron kechikishi mumkin, shuning uchun
    # erta boshlab, post tayyorlanadi va aniq 19:00 da chiqariladi.
    - cron: "20 13 * * *"
    # Zaxira ishga tushirishlar: GitHub cron ba'zan kechikadi yoki tushib qoladi.
    # Bugun post chiqqan bo'lsa, keyingilari hech narsa qilmaydi (main.py tekshiradi).
    - cron: "40 13 * * *"
    - cron: "55 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kanalga chiqarmasdan sinash"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # eng so'nggi history.json bilan ishlash uchun
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ixtiyoriy: Gemini band bo'lsa matn uchun zaxira
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python main.py --publish-at 19:00
          else
            python main.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: out/
      - name: Tarixni saqlash (mavzular takrorlanmasligi uchun)
        if: success()
        # history.json, oldindan tayyorlangan rasm va galereya
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A state/
          git diff --cached --quiet || (git commit -m "state: $(date +%F)" && git push)
